<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>!DOCTYPE Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("bg.png") repeat; /* replace bg.png with your background image file */
      color: #fff;
      text-align: center;
    }
    header {
      padding: 40px 20px;
      background: rgba(0,0,0,0.6); /* overlay so text is readable */
    }
    header img {
      height: 80px;
    }
    h1 {
      margin-top: 20px;
      font-size: 2em;
    }
    h2 {
      margin-top: 10px;
      font-size: 1.5em;
      color: #ffcccb;
    }
    main {
      padding: 20px;
      background: rgba(0,0,0,0.7);
      margin: 20px auto;
      max-width: 900px;
      border-radius: 10px;
    }
    .demo {
      margin-top: 30px;
    }
    .signup-link button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 1.2em;
      background: red;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .signup-link button:hover {
      background: darkred;
    }
    footer {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.svg" alt="!DOCTYPE Games Logo">
    <h1>!DOCTYPE Games</h1>
    <h2>The New Flash Heaven</h2>
    <p>Declare your creativity — Flash, HTML, EXE, and more.</p>
  </header>

  <main>
    <p>Welcome to the prototype site. Soon you’ll be able to upload and play SWF, HTML, and EXE games here.</p>
    <p>⚡ Work in progress — stay tuned!</p>

    <div class="demo">
      <h2>Demo Flash Game</h2>
      <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
      <embed src="games/demo.swf" width="640" height="480">
    </div>

<div class="signup-link">
  <a href="singup.html">
    <button>Sign Up</button>
  </a>
</div>
  </main>

  <footer>
    <p>⚡ The New Flash Heaven ⚡</p>
  </footer>
</body>
</html>
